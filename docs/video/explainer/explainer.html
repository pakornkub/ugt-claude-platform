<script type="module">
import * as THREE from 'three';

function spline(keys,t){
  const n=keys.length; if(t<=keys[0][0])return keys[0][1].slice(); if(t>=keys[n-1][0])return keys[n-1][1].slice();
  let i=0; while(keys[i+1][0]<t)i++;
  const [t0,p0]=keys[i],[t1,p1]=keys[i+1]; const h=t1-t0,s=(t-t0)/h;
  const tan=j=>{if(j<=0||j>=n-1||!keys[j][2])return keys[j][1].map(()=>0);const [ta,pa]=keys[j-1],[tb,pb]=keys[j+1];return pa.map((_,k)=>(pb[k]-pa[k])/(tb-ta))};
  const m0=tan(i),m1=tan(i+1);const h00=2*s**3-3*s*s+1,h10=s**3-2*s*s+s,h01=-2*s**3+3*s*s,h11=s**3-s*s;

const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);

const ADD=(c,op=1)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});

const grid=new THREE.GridHelper(700,350,0x2a3170,0x161c44); grid.position.set(110,-7,0); grid.material.transparent=true; grid.material.opacity=.7; scene.add(grid);

// ---------- CSS3D panel helper ----------
const objs={};
function panel(id,html,w,h,x,y,z,cls='pn',ry=0){

`<span class="k">'use client'</span>`,

  // S4
  show('qp',t,29.4,35,{dy:.4});
  QS.forEach((q,i)=>{q[1].forEach((o,j)=>$('op'+i+'_'+j).classList.toggle('sel',j===q[2]&&t>=30.6+i*.8))});

  // S5
  mods.forEach((m,i)=>{const a=MT(i), on=t>=a, skip=i===5;
    const k=P(t,a,.5,E.back);
    m.core.material.color.setHex(on?(skip?0x2b3050:0xeef2ff):0x2b3070);
    m.core.scale.setScalar(1+(on&&!skip?(1-P(t,a,.5))*.6:0));
    m.g.material.opacity=on&&!skip?.9:(t>35.3?.25:0); m.g.material.color.setHex(on&&!skip?0x22d3ee:0x6366f1);
    m.ring.rotation.set(t*.6+i,t*.9,0); m.ring.material.opacity=on&&!skip?.8:.3; m.ring.scale.setScalar(on&&!skip?1+.12*Math.sin(t*5):1);
    if(m.seg) m.seg.scale.x=Math.max(.001,4.1*P(t,a+.6,1.2,E.io));
    const op=show('ml'+i,t,35.4+i*.1,52.2,{dy:.3,s0:.8}); objs['ml'+i].element.style.opacity=op*(on?(skip?.4:1):.5);
    objs['ml'+i].element.style.color=on&&!skip?'#fff':'';
  });
  show('skipU',t,MT(5)+.2,52.2,{dy:0});
  WHY.forEach((w,k)=>show('why'+k,t,MT(w[0])+.5,52.2,{dy:.3,s0:.8}));
  arcs.forEach(a=>{const k=P(t,a.t,.8,E.io);a.tube.geometry.setDrawRange(0,Math.floor(k*64)*6*6);a.tube.visible=t<52.4});
  mods.forEach(m=>{const v=t>34.5&&t<53;m.core.visible=m.ring.visible=m.g.visible=v;if(m.seg)m.seg.visible=v});

  // S6
  show('vt',t,52.4,58.2,{dy:.4});
  const vl=['<span class="p">❯</span> node verify.mjs  <span class="dim"># ทุกโมดูลที่ติดตั้ง</span>',''];
  VER.forEach((v,i)=>{if(t>53.2+i*.28)vl.push(`  <span class="ok">✔</span> ${v}`)});
  if(t>55.4) vl.push('',`<span class="ok">7 passed</span> · 0 warning(s) · <span class="ok">0 failed</span>`);
  $('vtb').innerHTML=vl.join('\n');
  show('doc',t,55.8,58.2,{dy:.5,s0:.8}); [0,1,2,3].forEach(i=>$('dl'+i).style.opacity=P(t,56.2+i*.22,.3));

  // S7
  show('ed7',t,58.4,68,{dy:.4});
  const L7=[`<span class="k">export async function</span> <span class="f">getShift</span>(date: Date, empCode: string) {`,
    `  <span class="k">return</span> prisma.$queryRaw\``,
    `    EXEC usp_GetShiftSchedule \${<span class="n">startOfDay(date)</span>}, \${empCode}\``,
    `}`];
  const n7=cl((t-59)*2.6,0,4); let code7=L7.slice(0,Math.floor(n7));
  if(t>63.6){code7=[L7[0],L7[1],`<span class="del">    EXEC usp_GetShiftSchedule \${startOfDay(date)}, \${empCode}\`</span>`,`<span class="add">    EXEC usp_GetShiftSchedule \${<span class="n">toLocalYmd(date)</span>}, \${empCode}\`   <span class="ok">✓ แก้ก่อนเขียนเสร็จ</span></span>`,L7[3]]}
  $('code7').innerHTML=code7.join('\n')+(t<61?'<span class="caret"></span>':'');
  show('wn',t,61.2,67.8,{dy:.5,s0:.8});
  objs.ed7.element.querySelector('.tg').textContent=t>61.2?'หยุดก่อน — มีกับดัก':'AI กำลังเขียน…';

  // S8
  show('sA',t,68.4,75,{dy:.4}); show('hub',t,68.9,75,{dy:.3,s0:.6});
  FILES.forEach((f,i)=>{const a=69.6+i*.32, k=P(t,a,.7,E.io); const o=objs['fc'+i];
    o.visible=t>a&&t<75; o.element.style.opacity=P(t,a,.2)*(1-P(t,74.6,.3));
    o.position.set(lerp(177,181,k),lerp(.6,1.35-i*.62,k),lerp(.4,.2,k)+Math.sin(k*Math.PI)*1.2); o.scale.setScalar(.01*(.7+.3*k));});
  show('sB',t,71.8,75,{dy:.4}); [0,1,2].forEach(i=>$('sb'+i).style.opacity=P(t,72.4+i*.45,.35));

  // S9
  show('pf',t,75.4,80.6,{dy:.4});
  const k1=P(t,76.2,1.5); $('pb1').style.width=k1*100+'%'; $('pb2').style.width=k1*53+'%'; $('pv1').textContent=Math.round(k1*34)+'/34'; $('pv2').textContent=Math.round(k1*18)+'/34';
  [0,1].forEach(i=>$('ti'+i).style.opacity=P(t,77.6+i*.35,.4));

  // S10
  show('cta',t,80.8,1e9,{dy:.3,s0:.92});
  [...objs.cta.element.firstElementChild.children].forEach((e,i)=>{const k=P(t,81+i*.18,.5);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*20}px)`});

  hud(t);
  R.render(scene,cam); CR.render(cssScene,cam);
}

window.render=render; window.DUR=DUR;

if(!window.__RENDER){
  addEventListener('resize',fit);fit();
  const q=new URLSearchParams(location.search); const T0=parseFloat(q.get('t')||'0');
  window.__ready.then(()=>{render(T0); if(q.has('still'))return;
    let start=null; const au=new Audio('music.mp3');
    addEventListener('click',()=>{if(start!==null)return;start=performance.now()-T0*1000;au.currentTime=T0;au.play().catch(()=>{});
      const loop=now=>{const t=(now-start)/1000;if(t>=DUR){render(DUR-.01);return}render(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)});});
}
