<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGT Sizzle Reel</title>
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../cm/fonts/Inter.ttf)}
@font-face{font-family:'Noto Sans Thai';font-weight:100 900;src:url(../cm/fonts/NotoSansThai.ttf)}
:root{--ink:#1e2436;--ac:#4f46e5;--ac-d:#3730a3;--yel:#fcd34d;--red:#e11d48;--ok:#047857;--font:'Inter','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f8f9fc;font-family:var(--font);color:var(--ink);flex:none;transform-origin:center}
.src{position:absolute;inset:0;width:1920px;height:1080px;border:0;visibility:hidden}
#wrap{position:absolute;inset:0;transform-origin:50% 50%}
#textbg{position:absolute;inset:0;background:#fff;display:none}
#textbg .speed{position:absolute;inset:-300px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(30,36,54,.07) 0 1.2deg,transparent 1.2deg 6deg)}
.telop{font-weight:900;letter-spacing:-.01em;line-height:1.08;color:#fff;paint-order:stroke fill;-webkit-text-stroke:var(--sw,18px) var(--sc,var(--ac));text-shadow:10px 10px 0 var(--ink);white-space:nowrap}
.telop.red{--sc:var(--red)}.telop.ok{--sc:var(--ok)}
.ctr{position:absolute;left:0;right:0;text-align:center}
#word{position:absolute;left:0;right:0;text-align:center}
#hero{position:absolute;inset:0;pointer-events:none}
#hero .fade{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(transparent,rgba(248,249,252,.92) 55%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#bars{position:absolute;inset:0;pointer-events:none}
#bars i{position:absolute;left:0;right:0;height:0;background:#0b0f1f}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <iframe class="src" id="A" src="../story/story.html?embed"></iframe>
    <iframe class="src" id="B" src="../cm/cm.html?embed"></iframe>
    <div id="textbg"><div class="speed"></div>
      <div class="ctr telop" id="t0" style="top:150px;font-size:170px">โค้ด</div>
      <div class="ctr telop" id="t1" style="top:370px;font-size:170px">คนละ</div>
      <div class="ctr telop red" id="t2" style="top:600px;font-size:190px">แบบ!</div>
      <div class="ctr" id="t3" style="top:420px;font-weight:900;font-size:120px">จนกระทั่ง…</div>
    </div>
  </div>
  <div id="hero">
    <div class="fade" id="hfade"></div>
    <svg id="hlogo" class="ctr" style="left:0;right:0;margin:auto;top:640px;height:84px;position:absolute" viewBox="0 0 190 52"><g transform="translate(0,52) scale(0.1,-0.1)" fill="#1273bc"><path d="M52 318 c-18 -101 -32 -196 -32 -211 0 -18 11 -39 28 -57 36 -35 106 -44 300 -38 147 5 187 16 217 62 12 18 85 378 85 419 0 4 -28 7 -62 5 l-63 -3 -26 -145 c-14 -80 -29 -162 -33 -182 l-7 -38 -154 0 c-85 0 -155 3 -155 8 0 4 14 79 30 167 16 88 30 168 30 178 0 14 -10 17 -63 17 l-63 0 -32 -182z"/><path d="M720 493 c0 -5 -18 -110 -40 -236 -22 -125 -40 -232 -40 -238 0 -8 75 -10 243 -7 210 3 246 6 275 21 38 21 66 75 76 149 6 38 4 50 -12 65 -18 18 -18 19 11 44 28 23 30 31 31 93 1 62 -1 70 -27 92 -28 24 -28 24 -273 24 -134 0 -244 -3 -244 -7z m420 -112 c0 -11 -4 -31 -10 -45 -9 -26 -10 -26 -129 -26 -115 0 -119 -1 -125 -22 -3 -13 -6 -33 -6 -45 0 -23 2 -23 114 -23 65 0 117 -4 121 -10 3 -5 3 -25 -1 -45 l-6 -35 -154 0 c-85 0 -154 4 -154 8 0 12 40 236 45 250 3 9 43 12 155 12 142 0 150 -1 150 -19z"/><path d="M1403 485 c-17 -7 -39 -25 -48 -38 -17 -27 -65 -266 -65 -328 0 -49 33 -87 85 -99 54 -13 412 -13 420 0 3 5 9 32 12 60 l6 50 -197 0 c-182 0 -196 1 -196 18 0 26 38 231 45 243 4 5 91 9 204 9 l198 0 7 38 c3 20 6 43 6 50 0 18 -433 16 -477 -3z"/><path d="M1501 270 c-5 -25 -8 -46 -6 -48 1 -2 76 -3 166 -3 l164 0 6 28 c17 73 27 68 -156 68 l-164 0 -10 -45z"/></g></svg>
    <div class="ctr telop" id="htitle" style="top:740px;font-size:118px;letter-spacing:.02em">UGT Claude Platform</div>
    <div class="ctr" id="htag" style="top:905px;font-weight:900;font-size:52px"><span style="background:linear-gradient(transparent 58%,var(--yel) 58%,var(--yel) 92%,transparent 92%)">ติดตั้งครั้งเดียว</span> — มาตรฐานเดียวกันทั้งองค์กร</div>
  </div>
  <div id="word" class="telop"></div>
  <div id="bars"><i id="bt" style="top:0"></i><i id="bb" style="bottom:0"></i></div>
  <div id="flash"></div>
</div>

<script>
// ---------- timing (same grid as music.py) ----------
const BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4;
const G = g => g * BEAT;                         // beat index → seconds
const CMT = (bar, beat = 0) => (bar * 4 + beat) * BEAT;   // cm.html's own bar clock
const DUR = G(80) + 1.5;
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const E = { out: t => 1 - (1 - t) ** 3, in: t => t * t * t, io: t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2 };
const P = (t, a, d, e = E.out) => e(cl((t - a) / d));
const lerp = (a, b, k) => a + (b - a) * k;
const lerpA = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));

// ---------- shot list: [startBeat, beats, source, srcStart, rate, word, style, camFrom, camTo] ----------
// source: 'T' title card · 'A' story.html (3D city) · 'B' cm.html (JP-CM 2D)
const S = [
  [0, 3, 'T'],
  [3, 2, 'A', 4.6, 1.2, 'ดีไซน์ไม่ตรงกัน', 'low'],
  [5, 2, 'A', 5.5, 1.0, 'deploy ยาก', 'low red'],
  [7, 1, 'B', CMT(5, 2), 1.0],
  [8, 1, 'T3'],
  [9, 3, 'A', 10.15, 1.0, null, null, [-12, 4, 24, -13, 5, 10, 44], [-9, 3, 21, -11.5, 2, 10, 40]],
  [12, 4, 'B', CMT(7), 1.0],
  [16, 2, 'B', CMT(9, 1), 1.6],
  [18, 2, 'B', CMT(11, 1), 2.0],
  [20, 1, 'A', 20.4, 1.2, 'Database', 'low'],
  [21, 1, 'A', 25.4, 1.2, 'Quality', 'low'],
  [22, 1, 'A', 28.6, 1.4, 'Design', 'low'],
  [23, 1, 'A', 32.6, 1.4, 'Auth', 'low'],
  [24, .5, 'B', CMT(13, 1.5), 1, 'ตรวจ'], [24.5, .5, 'B', CMT(14, 2), 1, 'ถาม'],
  [25, .5, 'B', CMT(15, 1.2), 1, 'เรียง'], [25.5, .5, 'B', CMT(16, 2), 1, 'ดีไซน์'],
  [26, .5, 'B', CMT(17, 2), 1, 'กัน'], [26.5, .5, 'B', CMT(18, 1.6), 1, 'จำ'],
  [27, .5, 'B', CMT(20, 1.1), 1, 'ผ่าน!', 'ok'], [27.5, .5, 'A', 36.6, 1, 'CI/CD', 'low'],
  [28, 4, 'A', 37.8, 1.5, 'ขึ้น server จริง!', 'late'],
  [32, 8, 'A', 42.0, 1.12, null, 'drop', [34, 30, 22, 6, 0, -36, 46], [-24, 42, 14, 0, 0, -38, 46]],
  [40, 2, 'B', CMT(26, 1), 1.0],
  [42, 2, 'A', 50.0, 1.0, 'ความรู้ไม่หายไปไหน', 'low'],
  [44, 2, 'B', CMT(21, 3), 1.5],
  [46, 2, 'B', CMT(24, 2), 2.5],
  [48, 16, 'A', 58.0, .45, null, 'hero', [46, 12, 26, 4, 2, -34, 44], [2, 48, 38, 0, -2, -40, 44]],
  [64, 17.5, 'B', CMT(28), 1.0],
];
const DROPW = [[32, 'มาตรฐาน'], [34, 'เดียวกัน'], [36, 'ทั้ง'], [38, 'องค์กร!']];
const HITS = [3, 7, 9, 12, 20, 28, 32, 40, 48, 64];

let cur = -1;
function render(t) {
  const g = t / BEAT;
  let i = S.findIndex((s, k) => g >= s[0] - 1e-6 && (k === S.length - 1 || g < S[k + 1][0]));
  if (i < 0) i = S.length - 1;
  const [g0, len, src, s0, rate, word, style, cf, ct] = S[i];
  const lt = t - G(g0);
  const A = $('A'), B = $('B');
  A.style.visibility = src === 'A' ? 'visible' : 'hidden';
  B.style.visibility = src === 'B' ? 'visible' : 'hidden';
  $('textbg').style.display = src[0] === 'T' ? 'block' : 'none';
  if (src === 'A') {
    const w = A.contentWindow;
    const k = E.io(cl(lt / G(len)));
    w.camOverride = cf ? () => lerpA(cf, ct, k) : null;
    w.render(s0 + lt * rate);
  }
  if (src === 'B') B.contentWindow.render(s0 + lt * rate);
  if (src === 'T') {
    [['t0', 0], ['t1', 1], ['t2', 2]].forEach(([id, b]) => { const k = P(t, G(b), BEAT * .5); const el = $(id);
      el.style.opacity = t >= G(b) ? 1 : 0; el.style.transform = `scale(${lerp(2.2, 1, k)}) rotate(${(1 - k) * (b % 2 ? 6 : -6)}deg)`; });
    $('t3').style.display = 'none'; ['t0', 't1', 't2'].forEach(id => $(id).style.display = 'block');
  }
  if (src === 'T3') { ['t0', 't1', 't2'].forEach(id => $(id).style.display = 'none'); const el = $('t3'); el.style.display = 'block'; el.style.transform = `scale(${.8 + lt * .3})`; el.style.opacity = P(t, G(g0), .12); }

  // whip transition on every cut
  const wk = P(t, G(g0), .12);
  const dir = i % 2 ? 1 : -1;
  $('wrap').style.transform = `translateX(${(1 - wk) * 90 * dir}px) scale(${1 + (1 - wk) * .04 + Math.exp(-((t % BEAT) / BEAT) * 6) * .01})`;
  $('wrap').style.filter = wk < 1 ? `blur(${(1 - wk) * 10}px)` : '';

  // kinetic word
  const W = $('word');
  let wtxt = word, wst = style || '', wstart = G(g0);
  if (style === 'drop') { const d = [...DROPW].reverse().find(d => g >= d[0]); wtxt = d[1]; wstart = G(d[0]); wst = 'drop'; }
  if (style === 'late') wstart = G(g0 + 1.5);
  if (wtxt && t >= wstart && style !== 'hero') {
    if (W.dataset.k !== wtxt) { W.textContent = wtxt; W.dataset.k = wtxt; }
    const k = P(t, wstart, BEAT * .35);
    const low = wst.includes('low') || wst === 'late';
    W.className = 'telop' + (wst.includes('red') ? ' red' : wst.includes('ok') ? ' ok' : '');
    W.style.fontSize = wst === 'drop' ? '230px' : low ? '110px' : '170px';
    W.style.top = wst === 'drop' ? '380px' : low ? '800px' : '400px';
    W.style.opacity = 1; W.style.transform = `scale(${lerp(1.9, 1, k)}) rotate(${(1 - k) * -5}deg)`;
  } else { W.style.opacity = 0; W.dataset.k = ''; }

  // hero lockup
  const hero = style === 'hero';
  const hs = G(48);
  $('hero').style.display = hero ? 'block' : 'none';
  if (hero) {
    $('hfade').style.opacity = P(t, hs + G(3), G(2));
    [['hlogo', 4], ['htitle', 6], ['htag', 8]].forEach(([id, b]) => { const k = P(t, hs + G(b), BEAT * .7, E.out); const el = $(id);
      el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 40}px) scale(${id === 'htitle' ? lerp(1.6, 1, P(t, hs + G(b), BEAT * .5)) : 1})`; });
  }
  // cinematic bars during the build & hero
  const bars = (g >= 20 && g < 32) ? 70 : (hero ? 70 * (1 - P(t, G(62), G(2))) : 0);
  $('bt').style.height = $('bb').style.height = bars + 'px';
  // flash on the big hits
  let fl = 0; for (const h of HITS) { const c = G(h); if (t >= c && t < c + .25) fl = Math.max(fl, 1 - (t - c) / .25); }
  $('flash').style.opacity = fl * .7;
}
window.render = render; window.DUR = DUR;
const frameReady = f => new Promise(res => { const chk = () => { const w = f.contentWindow; if (w && w.render && w.__ready) w.__ready.then ? w.__ready.then(res) : res(); else setTimeout(chk, 50) }; chk(); });
window.__ready = Promise.all([frameReady($('A')), frameReady($('B')), document.fonts.ready]).then(() => new Promise(r => setTimeout(r, 300)));

function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `scale(${s})` }
if (!window.__RENDER) {
  addEventListener('resize', fit); fit();
  const q = new URLSearchParams(location.search); const T0 = parseFloat(q.get('t') || '0');
  window.__ready.then(() => { render(T0); if (q.has('still')) return;
    let start = null; const au = new Audio('music.mp3');
    addEventListener('click', () => { if (start !== null) return; start = performance.now() - T0 * 1000; au.currentTime = T0; au.play().catch(() => { });
      const loop = now => { const t = (now - start) / 1000; if (t >= DUR) { render(DUR - .01); return } render(t); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }); });
}
</script>
</body>
</html>
