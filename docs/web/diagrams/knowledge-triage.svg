      #knowledge-triage-root .dd-call { font-family: 'Instrument Serif', 'Noto Serif Thai', serif; font-size: 20px; font-style: italic; fill: #1e2436; }
      #knowledge-triage-root .diagram-container { overflow-x: visible; }</style>
