<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="knowledge-triage-title knowledge-triage-desc" id="knowledge-triage-root">
        <title id="knowledge-triage-title">คัดความรู้ใหม่ไปเก็บให้ถูกที่</title>
        <desc id="knowledge-triage-desc">Flowchart: ถ้าเป็นมติดีไซน์ไป docs/DESIGN.md §10, มติอื่นไป decisions.md (หรือ docs/adr/ บน bundle mattpocock); ถ้าเป็นบั๊กที่จริงกับทุกโปรเจคบน stack (เหตุอยู่ที่ stack, โปรเจคอื่นก็เจอ, แก้ได้จริงแล้ว) ให้เปิด PR ด้วย /ugt-contribute ไม่อย่างนั้นเก็บใน docs/project-context/troubleshooting.md; งานค้างไป handoff.md และความชอบส่วนตัวไป memory</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;family=Noto+Serif+Thai:wght@400&amp;display=swap');
      #knowledge-triage-root { --color-paper:   #ffffff;
      --color-paper-2: #f8f9fc;
      --color-ink:     #1e2436;
      --color-muted:   #4b5268;
      --color-soft:    #6d7590;
