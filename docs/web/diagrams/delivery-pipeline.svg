<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delivery-pipeline-title delivery-pipeline-desc" id="delivery-pipeline-root">
        <title id="delivery-pipeline-title">Delivery pipeline: GitHub → Jenkins → Docker</title>
        <desc id="delivery-pipeline-desc">การ push ขึ้น GitHub ปลุก Jenkins ให้รัน 10 stage (1–5 ตรวจโค้ดและ build, 6–8 OWASP และ SonarQube Quality Gate, 9–10 Docker Build และ Deploy เฉพาะ main/develop) จากนั้น docker compose รัน image บน Docker host (ข้อมูลถาวรใต้ /home/docker02/appdata) และ nginx เปิดแอปที่ URL แบบ subpath</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;family=Noto+Serif+Thai:wght@400&amp;display=swap');
      #delivery-pipeline-root { --color-paper:   #ffffff;
      --color-paper-2: #f8f9fc;
      --color-ink:     #1e2436;
      --color-muted:   #4b5268;
      --color-soft:    #6d7590;
      --color-rule:    #e5e8f0;
      --color-accent:  #4f46e5;
      --color-accent-tint: #e0e7ff;
      --font-sans:  'Inter', 'Noto Sans Thai', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif Thai', serif;
      --font-mono:  'Geist Mono', ui-monospace, Consolas, monospace; }
      #delivery-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #delivery-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #delivery-pipeline-root .sub { color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
      #delivery-pipeline-root .dd-name { font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif; font-size: 24px; font-weight: 600; fill: #1e2436; }
      #delivery-pipeline-root .dd-mono { font-family: 'Geist Mono', ui-monospace, Consolas, monospace; font-size: 18px; font-weight: 400; fill: #4b5268; }
      #delivery-pipeline-root .dd-th { font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif; font-size: 18px; font-weight: 500; fill: #4b5268; }
      #delivery-pipeline-root .dd-lbl-t { font-family: 'Geist Mono', ui-monospace, Consolas, monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.04em; }
      #delivery-pipeline-root .dd-lblth { font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif; font-size: 18px; font-weight: 500; }
      #delivery-pipeline-root .dd-call { font-family: 'Instrument Serif', 'Noto Serif Thai', serif; font-size: 20px; font-style: italic; fill: #1e2436; }
      #delivery-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <marker id="delivery-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5268"/></marker>
          <marker id="delivery-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>
<rect x="232" y="72" width="1008" height="288" rx="10" fill="#1e2436" stroke="#1e2436" stroke-width="1.2" stroke-dasharray="6,5" fill-opacity="0.015" stroke-opacity="0.35"/><rect x="248" y="60" width="304" height="24" rx="3" fill="#ffffff"/><text x="256" y="78" class="dd-lblth" fill="#6d7590">CI · Jenkins + SonarQube</text><rect x="232" y="416" width="1008" height="216" rx="10" fill="#1e2436" stroke="#1e2436" stroke-width="1.2" stroke-dasharray="6,5" fill-opacity="0.015" stroke-opacity="0.35"/><rect x="248" y="404" width="148" height="24" rx="3" fill="#ffffff"/><text x="256" y="422" class="dd-lblth" fill="#6d7590">Docker host</text><path d="M 184,216 H 255" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><g class="dd-lbl"><rect x="188" y="184" width="64" height="24" rx="3" fill="#ffffff"/><text x="220" y="202" class="dd-lbl-t" text-anchor="middle" fill="#6d7590">PUSH</text></g><path d="M 928,176 H 999" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><g class="dd-lbl"><rect x="932" y="144" width="64" height="24" rx="3" fill="#ffffff"/><text x="964" y="162" class="dd-lbl-t" text-anchor="middle" fill="#6d7590">SCAN</text></g><path d="M 1000,280 H 929" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#delivery-pipeline-arrow-accent)"/><g class="dd-lbl"><rect x="944" y="248" width="40" height="24" rx="3" fill="#ffffff"/><text x="964" y="266" class="dd-lblth" text-anchor="middle" fill="#4f46e5">ผล</text></g><path d="M 808,336 V 376 Q 808,384 816,384 H 1104 Q 1112,384 1112,392 V 455" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><g class="dd-lbl"><rect x="884" y="352" width="160" height="24" rx="3" fill="#ffffff"/><text x="964" y="370" class="dd-lbl-t" text-anchor="middle" fill="#6d7590">DOCKER BUILD</text></g><path d="M 1000,532 H 929" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><g class="dd-lbl"><rect x="938" y="500" width="52" height="24" rx="3" fill="#ffffff"/><text x="964" y="518" class="dd-lbl-t" text-anchor="middle" fill="#6d7590">RUN</text></g><path d="M 512,532 H 591" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><g class="dd-lbl"><rect x="514" y="500" width="76" height="24" rx="3" fill="#ffffff"/><text x="552" y="518" class="dd-lbl-t" text-anchor="middle" fill="#6d7590">PROXY</text></g><path d="M 176,532 H 255" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><g class="dd-lbl"><rect x="178" y="500" width="76" height="24" rx="3" fill="#ffffff"/><text x="216" y="518" class="dd-lbl-t" text-anchor="middle" fill="#6d7590">HTTPS</text></g><g data-node="github"><rect x="40" y="160" width="144" height="112" rx="8" fill="#ffffff"/><rect x="40" y="160" width="144" height="112" rx="8" fill="#1e2436" stroke="#1e2436" stroke-width="1.5" fill-opacity="0.03" stroke-opacity="0.45"/><text x="60" y="210" class="dd-name">GitHub</text><text x="60" y="244" class="dd-mono">git push</text></g><g data-node="jenkins"><rect x="256" y="104" width="672" height="232" rx="8" fill="#ffffff"/><rect x="256" y="104" width="672" height="232" rx="8" fill="#ffffff" stroke="#1e2436" stroke-width="1.5"/><text x="276" y="148" class="dd-name">Jenkins · 10 stage</text><rect x="276" y="176" width="200" height="136" rx="6" fill="#f8f9fc" stroke="#1e2436" stroke-width="1.2" stroke-opacity="0.35"/><text x="292" y="216" class="dd-th" style="fill:#1e2436">ตรวจ + build</text><text x="292" y="252" class="dd-mono" style="fill:#4b5268">stage 1–5</text><rect x="492" y="176" width="200" height="136" rx="6" fill="#f8f9fc" stroke="#1e2436" stroke-width="1.2" stroke-opacity="0.35"/><text x="508" y="216" class="dd-th" style="fill:#1e2436">OWASP + Sonar</text><text x="508" y="252" class="dd-mono" style="fill:#4b5268">stage 6–8</text><rect x="708" y="176" width="200" height="136" rx="6" fill="#f8f9fc" stroke="#1e2436" stroke-width="1.2" stroke-opacity="0.35"/><text x="724" y="216" class="dd-th" style="fill:#1e2436">Docker + Deploy</text><text x="724" y="252" class="dd-mono" style="fill:#4b5268">stage 9–10</text><text x="724" y="288" class="dd-th">main · develop</text></g><g data-node="sonar"><rect x="1000" y="120" width="224" height="200" rx="8" fill="#ffffff"/><rect x="1000" y="120" width="224" height="200" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="1020" y="168" class="dd-name">Quality Gate</text><text x="1020" y="208" class="dd-mono" style="fill:#1e2436">coverage ≥ 60%</text><text x="1020" y="240" class="dd-mono" style="fill:#1e2436">violations = 0</text><text x="1020" y="288" class="dd-th" style="fill:#4f46e5">ไม่ผ่าน = หยุด</text></g><g data-node="user"><rect x="40" y="480" width="136" height="104" rx="8" fill="#ffffff"/><rect x="40" y="480" width="136" height="104" rx="8" fill="#4b5268" stroke="#6d7590" stroke-width="1.5" fill-opacity="0.10"/><text x="60" y="526" class="dd-name">ผู้ใช้</text><text x="60" y="560" class="dd-th">browser</text></g><g data-node="nginx"><rect x="256" y="456" width="256" height="152" rx="8" fill="#ffffff"/><rect x="256" y="456" width="256" height="152" rx="8" fill="#ffffff" stroke="#1e2436" stroke-width="1.5"/><text x="276" y="504" class="dd-name">nginx</text><text x="276" y="544" class="dd-th">ถอด TLS · แยก path</text><text x="276" y="580" class="dd-mono" style="fill:#1e2436">/&lt;basePath&gt;</text></g><g data-node="container"><rect x="592" y="456" width="336" height="152" rx="8" fill="#ffffff"/><rect x="592" y="456" width="336" height="152" rx="8" fill="#ffffff" stroke="#1e2436" stroke-width="1.5"/><text x="612" y="504" class="dd-name">แอปใน container</text><text x="612" y="544" class="dd-mono" style="fill:#1e2436">:3000 · /api/health</text><text x="612" y="580" class="dd-mono">/home/docker02/appdata</text></g><g data-node="image"><rect x="1000" y="456" width="224" height="152" rx="8" fill="#ffffff"/><rect x="1000" y="456" width="224" height="152" rx="8" fill="#ffffff" stroke="#1e2436" stroke-width="1.5"/><text x="1020" y="504" class="dd-name">Docker image</text><text x="1020" y="544" class="dd-mono" style="fill:#1e2436">:&lt;BUILD_NUMBER&gt;</text><text x="1020" y="580" class="dd-th">ย้อนรุ่นได้</text></g><line x1="40" y1="652" x2="1240" y2="652" stroke="#e5e8f0" stroke-width="1.5"/><path d="M 40,684 H 80" fill="none" stroke="#4b5268" stroke-width="1.5" marker-end="url(#delivery-pipeline-arrow)"/><text x="96" y="690" class="dd-th">ลำดับงาน</text><path d="M 208,684 H 248" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#delivery-pipeline-arrow-accent)"/><text x="264" y="690" class="dd-th">Sonar ส่งผลกลับ</text><rect x="444" y="672" width="36" height="24" rx="5" fill="none" stroke="#1e2436" stroke-width="1.2" stroke-dasharray="6,5" stroke-opacity="0.35"/><text x="492" y="690" class="dd-th">โซนเครื่อง</text><text x="1240" y="690" class="dd-th" text-anchor="end" style="fill:#1e2436">ไม่ผ่าน Quality Gate = ไม่ deploy</text>
      </svg>
