<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="team-memory-title team-memory-desc" id="team-memory-root">
        <title id="team-memory-title">ความจำของทีมในโปรเจค</title>
        <desc id="team-memory-desc">Session ของ Claude อ่าน .claude/state/handoff.md ทุกครั้ง, docs/project-context/ เมื่อเกี่ยว และ CONTEXT.md กับ docs/adr/ บน bundle mattpocock; /ugt-context สร้าง docs/project-context/ ครั้งเดียว และ /ugt-handoff เขียน handoff.md กับ project-context ทุกครั้งที่จบงาน ทั้งหมด commit ใน git ให้ทั้งทีมใช้ร่วมกัน ส่วน memory ส่วนตัวไม่ commit และถ้าขัดกัน ไฟล์ใน git ชนะ</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;family=Noto+Serif+Thai:wght@400&amp;display=swap');
      #team-memory-root { --color-paper:   #ffffff;
