# Dev compose — deployed by Jenkins on the `develop` branch.
# Same shape as docker-compose.yml but with dev image/container names, dev host
# port, and the dev basePath in the healthcheck.
#
# Placeholders: __PROJECT_NAME__, __PORT_DEV__, __BASE_PATH_DEV__
services:
  app:
    build:
      context: .
      target: runner
    image: __PROJECT_NAME__-dev:latest
    pull_policy: never
    container_name: __PROJECT_NAME__-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-__PORT_DEV__}:3000'
    # [VOLUME] persistent data — uncomment + rename per interview; path must be
    # [VOLUME] under /srv/appdata (org contract). Delete block if nothing persists.
    # volumes:
    #   - /srv/appdata/__PROJECT_NAME__-dev/uploads:/app/uploads
    networks:
      - proxy-network
    environment:
      NODE_ENV: production
      SENTRY_ENVIRONMENT: development # [SENTRY] distinguishes dev events; DSN is shared
      # Dev .env MUST differ from prod in at least:
      #   DATABASE_URL  → separate dev DB (never point dev at prod data)
      #   auth secret   → never share secrets between environments
      DATABASE_URL: ${DATABASE_URL} # [DB] delete if no database
      # [METHOD: SSO or LDAP] Internal-CA TLS — same admin decision as prod
      # compose (docs/admin-handoff.md "TLS ภายในองค์กร"); dev may use a
      # different Keycloak/LDAP endpoint, confirm separately if so.
      # NODE_EXTRA_CA_CERTS: /etc/ssl/certs/org-ca.pem
      # NODE_TLS_REJECT_UNAUTHORIZED: '0'
      # Add the project's runtime secrets below (same keys as prod compose):
      # AUTH_SECRET: ${AUTH_SECRET}
      # SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000__BASE_PATH_DEV__/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  proxy-network:
    external: true
