# SonarQube Project Configuration — __PROJECT_DISPLAY_NAME__
#
# Note: projectKey/projectName here are DEFAULTS only. The Jenkinsfile
# SonarQube Analysis stage overrides them per branch with -D flags:
#   main    → __PROJECT_NAME__      / __PROJECT_DISPLAY_NAME__
#   develop → __PROJECT_NAME__-dev  / __PROJECT_DISPLAY_NAME__ (Dev)

sonar.projectKey=__PROJECT_NAME__
sonar.projectName=__PROJECT_DISPLAY_NAME__

# Source files — paths relative to workspace root (adjust to the project layout)
sonar.sources=app,components,lib,hooks

# Full exclusions — file NOT analyzed at all.
# Use ONLY for: generated code, build output, migrations, config files, test
# scaffolding, static assets — never production logic.
sonar.exclusions=\
  **/.next/**,\
  **/node_modules/**,\
  **/generated/**,\
  **/migrations/**,\
  coverage/**,\
  **/*.config.*,\
  **/*.d.ts,\
  **/e2e/**,\
  **/public/**

# Test files (adjust to the project layout — sonar-scanner HARD-FAILS when a
# listed path does not exist; remove/change entries that are not in this repo)
sonar.tests=lib/__tests__,components/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage — lcov.info is generated by: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions (test files, generated code, configs)
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/generated/**,\
  **/*.config.*,\
  **/migrations/**,\
  **/e2e/**

# ── Duplication (CPD) exclusions ─────────────────────────────────────────────
# CPD-only exclusion: the file is still scanned for bugs/smells, but NOT for
# duplicated blocks. Use for production code with INTENTIONAL structural
# repetition where forcing DRY would harm readability or break type safety
# (e.g. parallel table components differing only in a generic row type).
#
# RULE: every entry MUST have a rationale comment above it. Start EMPTY —
# add entries only when a real duplication finding is reviewed and judged
# intentional. Prefer extracting a generic component first (see
# references/sonarqube-setup.md → duplication strategy).
#
# Example:
# # Foo/Bar tables share structure but differ in TanStack generic row type —
# # unifying them would lose compile-time type safety
# sonar.cpd.exclusions=\
#   components/admin/foo-table.tsx,\
#   components/admin/bar-table.tsx

# ── Rule suppressions (false positives only) ─────────────────────────────────
# sonar.issue.ignore.multicriteria scopes a rule suppression to specific files.
# RULE: every suppression MUST have a rationale comment explaining WHY it is a
# false positive for this codebase. Start EMPTY — add only after reviewing a
# real finding.
#
# Example:
# # S6478 "inline component in parent": TanStack Table cell/header renderers
# # REQUIRE inline definitions (closures over row state) — library pattern,
# # not a defect. Scoped to table files only.
# sonar.issue.ignore.multicriteria=s6478tables
# sonar.issue.ignore.multicriteria.s6478tables.ruleKey=typescript:S6478
# sonar.issue.ignore.multicriteria.s6478tables.resourceKey=**/*table*.tsx

sonar.sourceEncoding=UTF-8

# ── OWASP Dependency-Check integration ───────────────────────────────────────
# Requires SonarQube Dependency-Check plugin v6.0.0+.
# Plugin v6+ reads the JSON report (XML was v5 and below); HTML is optional but
# enhances the SonarQube UI. dc-report/ is generated by the OWASP stage in the
# Jenkinsfile before sonar-scanner runs.
sonar.dependencyCheck.jsonReportPath=dc-report/dependency-check-report.json
sonar.dependencyCheck.htmlReportPath=dc-report/dependency-check-report.html
# CVSS score thresholds (0–10, NOT severity names) — issues raised at/above each score
sonar.dependencyCheck.severity.high=7.0
sonar.dependencyCheck.severity.medium=4.0
sonar.dependencyCheck.severity.low=0.0
