# Dev compose — deployed by Jenkins on the `develop` branch.
# Same shape as docker-compose.yml but with dev image/container names and dev
# host port.
#
# Placeholders: __PROJECT_NAME__, __PORT_DEV__
services:
  app:
    build:
      context: .
    image: __PROJECT_NAME__-dev:latest
    pull_policy: never
    container_name: __PROJECT_NAME__-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-__PORT_DEV__}:80'
    # [VOLUME] persistent data — uncomment + rename per interview; path must be
    # [VOLUME] under /home/docker02/appdata (org contract). Delete block if nothing persists.
    # volumes:
    #   - /home/docker02/appdata/__PROJECT_NAME__-dev/<name>:/var/www/html/<name>
    # [WP] WordPress: wp-content เป็น volume บังคับ — ห้ามลบบล็อกนี้เมื่อใช้ shape WP
    # volumes:
    #   - /home/docker02/appdata/__PROJECT_NAME__-dev/wp-content:/var/www/html/wp-content
    networks:
      - proxy-network
    environment:
      # Dev .env MUST differ from prod in at least:
      #   DATABASE_URL  → separate dev DB (never point dev at prod data)
      #   auth secret   → never share secrets between environments
      DATABASE_URL: ${DATABASE_URL} # [DB] delete if no database
      # [DB][LARAVEL] Laravel: uncomment these and delete DATABASE_URL — Laravel
      # reads DB_* (or DB_URL), never DATABASE_URL
      # DB_CONNECTION: ${DB_CONNECTION} # [DB][LARAVEL]
      # DB_HOST: ${DB_HOST} # [DB][LARAVEL]
      # DB_PORT: ${DB_PORT} # [DB][LARAVEL]
      # DB_DATABASE: ${DB_DATABASE} # [DB][LARAVEL]
      # DB_USERNAME: ${DB_USERNAME} # [DB][LARAVEL]
      # DB_PASSWORD: ${DB_PASSWORD} # [DB][LARAVEL]
      # Add the project's runtime secrets below (same keys as prod compose):
      # AUTH_SECRET: ${AUTH_SECRET}
      # SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      # `-L` is NOT optional — see the comment in docker-compose.yml (a 301 without
      # it scores as healthy while the endpoint underneath may be returning 503)
      test: ["CMD", "curl", "-fsS", "-L", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  proxy-network:
    external: true
