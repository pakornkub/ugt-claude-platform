# Production compose — deployed by Jenkins on the `main` branch.
# Jenkins always runs `docker-compose up -d --no-build`, so the build: section
# is never used at deploy time.
#
# Placeholders: __PROJECT_NAME__, __PORT_PROD__
services:
  app:
    build:
      context: .
    image: __PROJECT_NAME__:latest
    # Image is built locally by Jenkins — never pull from Docker Hub
    pull_policy: never
    container_name: __PROJECT_NAME__
    restart: unless-stopped
    ports:
      # Host port comes from .env (APP_PORT) with a default; container port is
      # always 80 (apache)
      - '${APP_PORT:-__PORT_PROD__}:80'
    # [VOLUME] persistent data — uncomment + rename per interview; path must be
    # [VOLUME] under /srv/appdata (org contract). Delete block if nothing persists.
    # volumes:
    #   - /srv/appdata/__PROJECT_NAME__/<name>:/var/www/html/<name>
    # [WP] WordPress: wp-content เป็น volume บังคับ — ห้ามลบบล็อกนี้เมื่อใช้ shape WP
    # volumes:
    #   - /srv/appdata/__PROJECT_NAME__/wp-content:/var/www/html/wp-content
    networks:
      - proxy-network
    environment:
      # Runtime secrets — read from .env (copied from the Jenkins Secret File
      # credential at deploy time). NEVER bake secrets into image layers.
      DATABASE_URL: ${DATABASE_URL} # [DB] delete if no database
      # Add the project's runtime secrets below, e.g.:
      # AUTH_SECRET: ${AUTH_SECRET}
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT:-25}
      # SMTP_FROM: ${SMTP_FROM}
      # SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      # Always 127.0.0.1 (NOT localhost — Alpine/slim resolves it to IPv6 ::1)
      # and always internal port 80 (container-internal, not the host port).
      # Same curl form as the Dockerfile HEALTHCHECK — curl is installed there on
      # purpose. `-L` is NOT optional: /api/health gets 301'd in opposite
      # directions depending on shape (Laravel strips the trailing slash, file-based
      # shapes add one) and `curl -f` without `-L` scores a 301 as success, so the
      # container would report healthy while the endpoint underneath returns 503.
      test: ["CMD", "curl", "-fsS", "-L", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  # Shared reverse-proxy network on the Docker host (created once, externally)
  proxy-network:
    external: true
