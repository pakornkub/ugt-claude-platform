# Dev compose — deployed by Jenkins on the `develop` branch.
# Same shape as docker-compose.yml but with dev image/container names and dev
# host port.
#
# [BATCH] shape: เปลี่ยน service name เป็น job, ตัด ports/healthcheck/restart → restart: "no"
# (ต้องแปลง "ทั้ง 2 ไฟล์" — ไฟล์ prod มี marker เดียวกัน)
#
# Placeholders: __PROJECT_NAME__, __PORT_DEV__
services:
  app:
    build:
      context: .
    image: __PROJECT_NAME__-dev:latest
    pull_policy: never
    container_name: __PROJECT_NAME__-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-__PORT_DEV__}:8000'
    # [VOLUME] persistent data — uncomment + rename per interview; path must be
    # [VOLUME] under /srv/appdata (org contract). Delete block if nothing persists.
    # volumes:
    #   - /srv/appdata/__PROJECT_NAME__-dev/<name>:/app/<name>
    networks:
      - proxy-network
    environment:
      # Dev .env MUST differ from prod in at least:
      #   DATABASE_URL  → separate dev DB (never point dev at prod data)
      #   auth secret   → never share secrets between environments
      DATABASE_URL: ${DATABASE_URL} # [DB] delete if no database
      # Add the project's runtime secrets below (same keys as prod compose):
      # AUTH_SECRET: ${AUTH_SECRET}
      # SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  proxy-network:
    external: true
